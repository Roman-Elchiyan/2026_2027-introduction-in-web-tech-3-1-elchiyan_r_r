name: Deploy MkDocs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build coursework site
        run: python -m mkdocs build --strict --config-file coursework/mkdocs.yml

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: coursework/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
